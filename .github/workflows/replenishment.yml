# Every morning: each store's "Replenishment needed" PDF into Dropbox /Replenishment,
# where Chad's Power Automate flow emails it to the store's manager (store_mailer.py).
# GitHub can start a scheduled run hours late or skip it (busiest on the hour:
# the 11:00 UTC run on 11/11 started at 18:26), so it is tried five times, off the
# hour, from 10:17 to 12:17 UTC (5:17-7:17 AM Detroit in winter, 6:17-8:17 in
# summer). --once-a-day makes every try after the first that sends do nothing,
# and the concurrency group keeps two late tries from running at once.
name: Replenishment lists

on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "47 10 * * *"
    - cron: "17 11 * * *"
    - cron: "47 11 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Dropbox (the flow then emails the managers)"
        type: boolean
        default: false

concurrency:
  group: replenishment
  cancel-in-progress: false

jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make the lists
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >
          python store_mailer.py
          ${{ (github.event_name == 'schedule' || inputs.upload) && '--dropbox' || '' }}
          ${{ github.event_name == 'schedule' && '--once-a-day' || '' }}
