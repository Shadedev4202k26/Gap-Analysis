# Every morning: each store's "Replenishment needed" PDF into Dropbox /Replenishment,
# where Chad's Power Automate flow emails it to the store's manager (store_mailer.py).
# 11:00 UTC = 6:00 AM Detroit in winter, 7:00 AM in summer.
name: Replenishment lists

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Dropbox (the flow then emails the managers)"
        type: boolean
        default: false

jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make the lists
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >
          python store_mailer.py
          ${{ (github.event_name == 'schedule' || inputs.upload) && '--dropbox' || '' }}
