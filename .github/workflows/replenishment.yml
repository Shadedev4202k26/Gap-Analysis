# Every morning: each store's "Replenishment needed" PDF into Dropbox /Replenishment,
# where Chad's Power Automate flow emails it to the store's manager (store_mailer.py).
#
# The morning start: Chad's Power Automate flow "Start replenishment lists" opens a
# GitHub issue titled "Send replenishment lists" at 6:00 AM Detroit time every day.
# GitHub starts issue-triggered jobs within seconds; its own timer ("schedule") ran
# hours late or not at all every day from 11/11 to 11/16, so the timer runs below are
# only a backup. Only an issue opened by the repo owner counts (the repo is public).
# --once-a-day makes every run after the first one that sends do nothing, and the
# concurrency group keeps two runs from going at once.
name: Replenishment lists

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 10 * * *"
    - cron: "47 10 * * *"
    - cron: "17 11 * * *"
    - cron: "47 11 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Dropbox (the flow then emails the managers)"
        type: boolean
        default: false

concurrency:
  group: replenishment
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  lists:
    if: >
      github.event_name != 'issues' || (
        github.event.issue.user.login == github.repository_owner &&
        startsWith(github.event.issue.title, 'Send replenishment lists'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make the lists
        id: lists
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          UPLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
          ONCE: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          args=""
          [ "$UPLOAD" = "true" ] && args="$args --dropbox"
          [ "$ONCE" = "true" ] && args="$args --once-a-day"
          python store_mailer.py $args 2>&1 | grep -v "No runtime found" | tee result.txt
          exit ${PIPESTATUS[0]}
      # Close the morning issue with what happened, so the issue list stays empty.
      - name: Close the morning issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.lists.outcome }}
        run: |
          { echo "Result: $OUTCOME"; echo '```'; cat result.txt 2>/dev/null; echo '```'; } > note.md
          gh issue close "${{ github.event.issue.number }}" -R "${{ github.repository }}" --comment "$(cat note.md)"
